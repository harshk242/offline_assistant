[project]
name = "offline-assistant"
version = "0.1.0"
description = "Offline maintenance assistant: keyword RAG over equipment manuals with an on-device LFM"
requires-python = ">=3.11"
dependencies = ["pdfplumber>=0.11", "pypdf>=4"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ask = "assistant.cli:ask_main"
ingest = "assistant.cli:ingest_main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
